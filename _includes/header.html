<div class="scroll-progress" id="scrollProgress"></div>

<nav class="site-nav" aria-label="Primary navigation">
    <a href="/" class="nav-logo" aria-label="StudentCalcTools home">
        <span class="nav-logo-icon" aria-hidden="true">S</span>
        <span class="brand-name">StudentCalc<span class="brand-accent">Tools</span></span>
    </a>

    <div class="nav-right">
        <div class="nav-links" id="navLinks">
            <a href="/" {% if page.url == "/" %}aria-current="page"{% endif %}>Home</a>

            <a href="/calculators/"
               {% if page.url contains "calculator" or page.url contains "study-time-planner" or page.url contains "essay-word-counter" %}
               aria-current="page"
               {% endif %}>
                Calculators
            </a>

            <a href="/blog/"
               {% if page.url contains "/blog/" %}
               aria-current="page"
               {% endif %}>
                Blog
            </a>

            <a href="/about-us/"
               {% if page.url == "/about-us/" %}
               aria-current="page"
               {% endif %}>
                About
            </a>

            <a href="/contact-us/"
               {% if page.url == "/contact-us/" %}
               aria-current="page"
               {% endif %}>
                Contact
            </a>
        </div>

        <span class="nav-tag">Free to use</span>

        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="navLinks">
            Menu
        </button>

        <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Switch to dark mode"
            title="Switch to dark mode">

            <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
                </svg>
            </span>

            <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
            </span>
        </button>
    </div>
</nav>
